<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>虚拟排队系统</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .queue-card {
            max-width: 450px;
            margin: 40px auto;
            background: white;
            padding: 35px 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        h1 {
            font-size: 24px;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 30px;
        }
        
        /* 状态看板样式 */
        .status-container {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 12px;
        }
        .status-item {
            flex: 1;
        }
        .status-label {
            font-size: 13px;
            color: #95a5a6;
            margin-bottom: 5px;
        }
        .status-value {
            font-size: 22px;
            font-weight: bold;
            color: #2c3e50;
        }
        .status-value.highlight {
            color: #e74c3c;
        }

        /* 按钮样式 */
        .btn-join {
            width: 100%;
            background-color: #3498db;
            color: white;
            font-size: 16px;
            font-weight: bold;
            padding: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
            transition: all 0.2s ease;
        }
        .btn-join:hover {
            background-color: #2980b9;
            transform: translateY(-1px);
        }
        
        /* 个人排队状态 */
        .user-ticket {
            margin-top: 25px;
            padding: 20px;
            border: 2px dashed #3498db;
            border-radius: 12px;
            background-color: #ebf5fb;
            display: none;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .ticket-num {
            font-size: 32px;
            font-weight: bold;
            color: #2980b9;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <div class="queue-card">
        <h1>现场排队候位</h1>
        <p class="subtitle">请加入队列，我们将在轮到您时发出通知</p>

        <!-- 整体排队状况 -->
        <div class="status-container">
            <div class="status-item" style="border-right: 1px solid #eee;">
                <div class="status-label">当前等待人数</div>
                <div id="current-wait" class="status-value">5 组</div>
            </div>
            <div class="status-item">
                <div class="status-label">预计等待时间</div>
                <div id="wait-time" class="status-value highlight">~15 分钟</div>
            </div>
        </div>

        <!-- 互动按钮 -->
        <button id="join-btn" class="btn-join" onclick="enterQueue()">点击取号排队</button>

        <!-- 成功加入队列后显示的号码牌 -->
        <div id="ticket" class="user-ticket">
            <div style="font-size: 14px; color: #7f8c8d;">您的排队号码</div>
            <div id="ticket-id" class="ticket-num">#1006</div>
            <p id="welcome-msg" style="margin: 5px 0 0 0; font-size: 15px; font-weight: 500;"></p>
            <p style="font-size: 12px; color: #95a5a6; margin-top: 10px;">请截屏保存此界面，静候呼叫。</p>
        </div>
    </div>

    <script>
        function enterQueue() {
            const name = prompt("请输入您的姓名/昵称以加入排队：");
            
            if (name && name.trim() !== "") {
                // 模拟生成排队号码和更新看板
                document.getElementById('welcome-msg').innerText = "您好 " + name + "，已成功锁定席位！";
                document.getElementById('ticket-id').innerText = "#" + Math.floor(1000 + Math.random() * 9000);
                
                // 更新看板数据（模拟前面多了一个人）
                document.getElementById('current-wait').innerText = "6 组";
                document.getElementById('wait-time').innerText = "~20 分钟";
                
                // 显示号码牌，隐藏按钮
                document.getElementById('ticket').style.display = "block";
                document.getElementById('join-btn').style.display = "none";
            }
        }
    </script>

</body>
</html>
