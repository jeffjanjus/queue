<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>请稍候，您已进入排队系统</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .queue-container {
            background: white;
            max-width: 480px;
            width: 90%;
            padding: 40px 30px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            border-top: 6px solid #2563eb;
        }
        .logo { font-size: 24px; font-weight: bold; color: #1f2937; margin-bottom: 20px; }
        .headline { font-size: 20px; font-weight: 600; color: #111827; margin-bottom: 10px; }
        .message { color: #4b5563; font-size: 14px; margin-bottom: 30px; line-height: 1.5; }
        
        /* 进度条 */
        .progress-container {
            background-color: #e5e7eb;
            border-radius: 9999px;
            height: 12px;
            width: 100%;
            margin-bottom: 30px;
            overflow: hidden;
        }
        .progress-bar {
            background-color: #2563eb;
            height: 100%;
            width: 0%;
            transition: width 1s linear;
        }

        /* 数据看板 */
        .grid-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
            text-align: left;
        }
        .stat-box {
            background: #f9fafb;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #e5e7eb;
        }
        .stat-label { font-size: 12px; color: #6b7280; text-transform: uppercase; margin-bottom: 5px; }
        .stat-value { font-size: 16px; font-weight: bold; color: #1f2937; }

        /* 旋转加载动画 */
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #2563eb;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="queue-container">
    <div class="logo">✦ 线上商城服务</div>
    <div class="spinner"></div>
    <div class="headline">您正在虚拟等候室中</div>
    <div class="message">由于当前访问量巨大，为了保证您的交易安全，我们正在限制进入人数。请不要刷新或关闭此页面，轮到您时系统会自动跳转。</div>

    <!-- 进度条 -->
    <div class="progress-container">
        <div id="progress" class="progress-bar"></div>
    </div>

    <!-- 排队核心数据 -->
    <div class="grid-stats">
        <div class="stat-box">
            <div class="stat-label">您的排队号码</div>
            <div id="queue-number" class="stat-value">--</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">预计等待时间</div>
            <div id="time-left" class="stat-value">计算中...</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">在您前面的人数</div>
            <div id="users-ahead" class="stat-value">--</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">最后更新时间</div>
            <div id="last-update" class="stat-value">刚刚</div>
        </div>
    </div>
</div>

<script>
    // 配置项
    const TARGET_URL = "https://google.com"; // 队列结束后真正跳转的目标网站
    const TOTAL_WAIT_SECONDS = 60; // 模拟总共需要排队多少秒（例如60秒）

    // 初始化或读取现有的排队状态
    let startTime = localStorage.getItem('queue_start_time');
    let myNumber = localStorage.getItem('queue_number');

    if (!startTime) {
        startTime = Date.now();
        myNumber = Math.floor(15000 + Math.random() * 5000); // 随机生成一个排队序号
        localStorage.setItem('queue_start_time', startTime);
        localStorage.setItem('queue_number', myNumber);
    }

    document.getElementById('queue-number').innerText = "#" + myNumber;

    function updateQueue() {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        const remaining = TOTAL_WAIT_SECONDS - elapsed;

        if (remaining <= 0) {
            // 排队结束，清除本地缓存并跳转
            localStorage.removeItem('queue_start_time');
            localStorage.removeItem('queue_number');
            window.location.href = TARGET_URL;
            return;
        }

        // 计算进度条百分比
        const progressPercent = (elapsed / TOTAL_WAIT_SECONDS) * 100;
        document.getElementById('progress').style.width = progressPercent + "%";

        // 计算前方人数和剩余时间
        const aheadCount = Math.ceil((remaining / TOTAL_WAIT_SECONDS) * (myNumber % 500));
        document.getElementById('users-ahead').innerText = aheadCount + " 人";
        
        const minutes = Math.floor(remaining / 60);
        const seconds = remaining % 60;
        document.getElementById('time-left').innerText = minutes > 0 ? `${minutes} 分 ${seconds} 秒` : `${seconds} 秒`;

        // 刷新最后更新时间
        const now = new Date();
        document.getElementById('last-update').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
    }

    // 每秒钟刷新一次排队状态
    setInterval(updateQueue, 1000);
    updateQueue();
</script>

</body>
</html>
